name: Rideadent Dev Build

on:
  push:
    branches:
      - dev/feasibility
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - name: Restore development signing key
        env:
          KEYSTORE_B64: ${{ secrets.RYDATENT_DEV_KEYSTORE_B64 }}
        run: |
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rideadent-dev.p12"
          chmod 600 "$RUNNER_TEMP/rideadent-dev.p12"

      - name: Test, lint and build
        env:
          RIDEADENT_DEV_KEYSTORE: ${{ runner.temp }}/rideadent-dev.p12
          RIDEADENT_DEV_PASSWORD: ${{ secrets.RYDATENT_DEV_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify signed APK and publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -Fq "Number of signers: 1" "$RUNNER_TEMP/signature.txt"
          grep -Fq "certificate SHA-256 digest: 55edd0be8813fcbbb4276115aa70601f7b43dae9e595f1c84d2c8ac837d7761a" "$RUNNER_TEMP/signature.txt"

          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$VERSION"
          TAG="v$VERSION"

          TAG_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || true)"

          if [ -z "$TAG_SHA" ]; then
            echo "No matching development tag. Build and signature are valid; no release created."
            exit 0
          fi

          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            if [ "$TAG" != "v0.1.0-dev.4" ]; then
              echo "ERROR: Tag does not point to this commit." >&2
              exit 1
            fi

            CHANGED="$(git diff --name-only "$TAG_SHA" "$GITHUB_SHA")"
            if [ "$CHANGED" != ".github/workflows/dev.yml" ]; then
              echo "ERROR: Source code changed since the dev.4 tag:" >&2
              printf "%s\n" "$CHANGED" >&2
              exit 1
            fi

            echo "dev.4 repair run: only the workflow differs from the tagged source."
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease already exists: $TAG"
            exit 0
          fi

          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Rideadent $VERSION" --notes "Signierter und geprüfter Entwicklungsstand, kein Stable-Release." --prerelease --latest=false
