plugins { id 'com.android.application' }
android { namespace 'de.pritwerk.rydatent'; compileSdk 37
 defaultConfig { applicationId 'de.pritwerk.rydatent'; minSdk 36; targetSdk 36; versionCode 23; versionName '0.1.0-dev.23' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

// Persistent signing for CI development APKs.
if (System.getenv("RYDATENT_DEV_KEYSTORE")) {
    android.signingConfigs.debug.storeFile =
        file(System.getenv("RYDATENT_DEV_KEYSTORE"))
    android.signingConfigs.debug.storePassword =
        System.getenv("RYDATENT_DEV_PASSWORD")
    android.signingConfigs.debug.keyAlias = "rydatentdev"
    android.signingConfigs.debug.keyPassword =
        System.getenv("RYDATENT_DEV_PASSWORD")
}
